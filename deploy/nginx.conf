# ------------------------------------------------------------------
# nginx 站点配置：Cesium 场景的静态托管要点
#   1. Cesium 的 Workers / Assets 是固定文件名，需较长缓存
#   2. wasm / 大 JSON 必须开 gzip，否则首屏下载翻倍
#   3. Vue 是 SPA，刷新子路由要回退到 index.html
# 说明：本文件放到 /etc/nginx/conf.d/ 下，属于 http 上下文内，
#       因此不要在这里写 events / http / user 等顶层指令。
# ------------------------------------------------------------------

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 不对外暴露 nginx 版本号
    server_tokens off;

    # ---- 压缩：Cesium 的 Assets/JSON 是主要受益者 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # ---- 安全兜底 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 带内容哈希的构建产物：可永久缓存 ----
    # 注意 1：location 内一旦出现 add_header，server 级 add_header 会失效，
    #         所以这里重复声明 nosniff，避免安全头被"吃掉"。
    # 注意 2：用 add_header 显式给完整 max-age，不要再加 expires，
    #         否则会同时下发两个 Cache-Control 头。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Cesium 静态资源：文件名不带哈希，靠镜像 tag 更新，缓存 30 天 ----
    location /cesium/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- 业务数据：可能被替换，短缓存 ----
    location /data/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- 入口页与 SPA 回退 ----
    # 注意：访问 "/" 命中的是 location /（index 指令内部的转发不算重定向），
    # 所以 no-cache 必须写在这里，写成 location = /index.html 对首页无效。
    # 刷新子路由也走这里 → 拿到 index.html 且不被强缓存，发版后立即生效。
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
